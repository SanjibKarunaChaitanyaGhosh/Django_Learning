{% extends "layout.html" %}

{% block Title %} Chai details Page {% endblock %}
{% block content %}

<h1>Welcome to the FirstAPP | Chai details Page </h1>


<h3 class='text-amber-50 text-4xl text-center'>{{chai.name}}</h3>


        <div class= "rounded-3xl p-4 flex justify-center">

            <img src="{{chai.image.url}}" alt="" 
                class="border-2 border-amber-400 rounded-3xl overflow-hidden w-100 h-80">

        </div>



<p class='text-amber-300 text-center'>{{chai.description}}</p>

<h3 class='text-amber-50 text-4xl text-center'>Price :{{chai.price}}</h3>


{% endblock %}
